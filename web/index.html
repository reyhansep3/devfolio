<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Reyhan Septri Asta — Flutter Mobile Developer Portfolio">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_portofolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutter_portofolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* ── Hindari flash putih saat engine boot / hot restart ── */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b0b0f; /* gelap, nyambung dgn tema app */
      overflow: hidden;
    }

    /* ── Loading bar di paling atas ── */
    #loading-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      z-index: 9999;
      background: rgba(200, 245, 90, 0.12); /* yellowgreen transparan */
      transition: opacity 0.45s ease;
    }
    #loading-bar.done {
      opacity: 0;
    }
    #loading-bar-fill {
      height: 100%;
      width: 0%;
      background: #c8f55a; /* AppColor.yellowgreen */
      box-shadow: 0 0 10px rgba(200, 245, 90, 0.7);
      border-radius: 0 2px 2px 0;
      transition: width 0.4s ease;
      /* denyut halus biar terasa "alive" saat loading */
      animation: pulse 1.1s ease-in-out infinite;
    }
    #loading-bar.indeterminate #loading-bar-fill {
      width: 90% !important;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.85; }
      50%      { opacity: 0.45; }
    }
  </style>

  <!--
    Flutter 3.29 bootstrap. `flutter_bootstrap.js` membaca `_flutter.buildConfig`
    dan otomatis memilih build yang kompatibel (WASM / skwasm / JS fallback),
    sehingga file ini aman dipakai baik untuk `flutter run` (JS) maupun
    `flutter build web --wasm` (WASM). JANGAN pakai `flutter.js` + inline
    loader lama, karena itu hanya support JS-mode dan akan 404 saat WASM.
  -->
  <script src="flutter_bootstrap.js" defer></script>
</head>
<body>
  <!-- Progress bar (muncul sebelum Flutter siap, hilang setelah runApp) -->
  <div id="loading-bar">
    <div id="loading-bar-fill"></div>
  </div>

  <script>
    (function () {
      var bar = document.getElementById('loading-bar');
      var fill = document.getElementById('loading-bar-fill');

      function startIndeterminate() {
        requestAnimationFrame(function () {
          fill.style.width = '15%';
          requestAnimationFrame(function () {
            bar.classList.add('indeterminate');
          });
        });
      }

      function finish() {
        bar.classList.remove('indeterminate');
        fill.style.width = '100%';
        setTimeout(function () {
          bar.classList.add('done');
          setTimeout(function () {
            if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
          }, 500);
        }, 220);
      }

      // flutter_bootstrap.js mengisi window._flutter.loader dan memanggil
      // .load() sendiri. Kita hanya perlu menunggu app selesai di-render.
      function waitForApp() {
        if (window._flutter && window._flutter.loader) {
          startIndeterminate();
          // .load() mengembalikan Promise saat engine siap + runApp selesai.
          window._flutter.loader.load({
            serviceWorkerSettings: {
              serviceWorkerVersion: '{{flutter_service_worker_version}}'
            }
          }).then(function () {
            finish();
          }).catch(function (err) {
            console.error(err);
            finish();
          });
        } else {
          // bootstrap belum siap, coba lagi sebentar lagi.
          setTimeout(waitForApp, 30);
        }
      }

      waitForApp();
    })();
  </script>
</body>
</html>
