<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Reyhan Septri Asta — Flutter Mobile Developer Portfolio">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_portofolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutter_portofolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* ── Hindari flash putih saat engine boot / hot restart ── */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b0b0f; /* gelap, nyambung dgn tema app */
      overflow: hidden;
    }

    /* Tampil sebelum Flutter memuat engine dan frame pertama. */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #0b0b0f;
      color: #c8f55a;
      font-family: Arial, Helvetica, sans-serif;
      transition: opacity 0.35s ease;
    }
    #loading-screen.done {
      opacity: 0;
      pointer-events: none;
    }
    #loading-content {
      width: min(280px, calc(100vw - 64px));
    }
    #loading-label {
      margin-bottom: 16px;
      color: #a7a7a7;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.25em;
    }
    #loading-value {
      font-size: clamp(64px, 15vw, 104px);
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.06em;
    }
    #loading-value span {
      font-size: 0.42em;
      vertical-align: 0.12em;
    }
    #loading-track {
      height: 2px;
      margin-top: 26px;
      background: rgba(200, 245, 90, 0.2);
    }
    #loading-fill {
      width: 1%;
      height: 100%;
      background: #c8f55a;
      box-shadow: 0 0 10px rgba(200, 245, 90, 0.5);
    }
  </style>

  <!--
    Flutter 3.29 bootstrap. `flutter_bootstrap.js` membaca `_flutter.buildConfig`
    dan otomatis memilih build yang kompatibel (WASM / skwasm / JS fallback),
    sehingga file ini aman dipakai baik untuk `flutter run` (JS) maupun
    `flutter build web --wasm` (WASM). JANGAN pakai `flutter.js` + inline
    loader lama, karena itu hanya support JS-mode dan akan 404 saat WASM.
  -->
  <script src="flutter_bootstrap.js" defer></script>
</head>
<body>
  <div id="loading-screen" role="progressbar" aria-label="Memuat portofolio" aria-valuemin="1" aria-valuemax="100" aria-valuenow="1">
    <div id="loading-content">
      <div id="loading-label">LOADING PORTFOLIO</div>
      <div id="loading-value">1<span>%</span></div>
      <div id="loading-track"><div id="loading-fill"></div></div>
    </div>
  </div>

  <script>
    (function () {
      var screen = document.getElementById('loading-screen');
      var value = document.getElementById('loading-value');
      var fill = document.getElementById('loading-fill');
      var current = 1;
      var homeReady = false;

      function show(percent) {
        if (percent === current) return;
        current = percent;
        value.firstChild.nodeValue = String(percent);
        fill.style.width = percent + '%';
        screen.setAttribute('aria-valuenow', String(percent));
      }

      function advance() {
        // Naik satu angka tiap 30 ms; tunggu frame Flutter sebelum lewat 95%.
        if (current < (homeReady ? 100 : 95)) show(current + 1);
        if (current === 100) {
          clearInterval(timer);
          setTimeout(function () {
            screen.classList.add('done');
            setTimeout(function () {
              screen.remove();
            }, 350);
          }, 180);
        }
      }

      // Bootstrap memanggil .load() sendiri.
      window.addEventListener('flutter-first-frame', function () {
        homeReady = true;
      }, { once: true });
      var timer = setInterval(advance, 30);
    })();
  </script>
</body>
</html>
