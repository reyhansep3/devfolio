<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_portofolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutter_portofolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* ── Hindari flash putih saat engine boot / hot restart ── */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0b0b0f; /* gelap, nyambung dgn tema app */
      overflow: hidden;
    }

    /* ── Loading bar di paling atas ── */
    #loading-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      z-index: 9999;
      background: rgba(200, 245, 90, 0.12); /* yellowgreen transparan */
      transition: opacity 0.45s ease;
    }
    #loading-bar.done {
      opacity: 0;
    }
    #loading-bar-fill {
      height: 100%;
      width: 0%;
      background: #c8f55a; /* AppColor.yellowgreen */
      box-shadow: 0 0 10px rgba(200, 245, 90, 0.7);
      border-radius: 0 2px 2px 0;
      transition: width 0.4s ease;
      /* denyut halus biar terasa "alive" saat loading */
      animation: pulse 1.1s ease-in-out infinite;
    }
    #loading-bar.indeterminate #loading-bar-fill {
      width: 90% !important;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.85; }
      50%      { opacity: 0.45; }
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <!-- Progress bar (muncul sebelum Flutter siap, hilang setelah runApp) -->
  <div id="loading-bar">
    <div id="loading-bar-fill"></div>
  </div>

  <script>
    (function () {
      var bar = document.getElementById('loading-bar');
      var fill = document.getElementById('loading-bar-fill');

      function startIndeterminate() {
        // mulai dari 0 lalu langsung ke 90% (animasi CSS handle easing)
        requestAnimationFrame(function () {
          fill.style.width = '15%';
          requestAnimationFrame(function () {
            bar.classList.add('indeterminate');
          });
        });
      }

      function finish() {
        bar.classList.remove('indeterminate');
        fill.style.width = '100%';
        // setelah bar penuh, fade out lalu hapus dari DOM
        setTimeout(function () {
          bar.classList.add('done');
          setTimeout(function () {
            if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
          }, 500);
        }, 220);
      }

      window.addEventListener('load', function (ev) {
        startIndeterminate();
        _flutter.loader
          .loadEntrypoint({
            serviceWorker: { serviceWorkerVersion: serviceWorkerVersion },
          })
          .then(function (engineInitializer) {
            return engineInitializer.initializeEngine();
          })
          .then(function (appRunner) {
            return appRunner.runApp();
          })
          .then(function () {
            // App sudah ke-render frame pertama -> selesaikan loading
            finish();
          })
          .catch(function (err) {
            // kalau gagal, tetap sembunyikan bar biar tidak nyangkut
            console.error(err);
            finish();
          });
      });
    })();
  </script>
</body>
</html>
